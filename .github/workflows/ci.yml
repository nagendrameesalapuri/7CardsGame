name: CI — Build & Test

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Lint & type-check ────────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: server
      - run: npm run lint
        working-directory: client
        continue-on-error: true
      - run: npm run lint
        working-directory: server
        continue-on-error: true
      - run: npx tsc --noEmit
        working-directory: server
        continue-on-error: true

  # ── Job 2: Frontend unit tests (Vitest) ────────────────────────────────────
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run test:unit
        working-directory: client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage-${{ github.run_number }}
          path: client/coverage/
          retention-days: 7

  # ── Job 3: Backend unit tests (Jest) ───────────────────────────────────────
  server-tests:
    name: Server Tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
        env:
          NODE_ENV: test

  # ── Job 4a: Smoke E2E tests (PRs only) ────────────────────────────────────
  smoke-e2e:
    name: Smoke E2E (Auth + Lobby + Wallet UI)
    runs-on: ubuntu-latest
    needs: [unit-tests, server-tests]
    if: github.event_name == 'pull_request'
    timeout-minutes: 25

    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      NODE_ENV: test
      CI: true
      MONGODB_URI: mongodb://localhost:27017/7cards_smoke
      MONGODB_URI_TEST: mongodb://localhost:27017/7cards_smoke
      JWT_SECRET: smoke-test-jwt-secret-32-chars!!
      ADMIN_SECRET: admin-test-123
      SESSION_SECRET: smoke-session-secret
      CLIENT_URL: http://localhost:3000
      PORT: '5000'
      # Disable real Google OAuth in tests
      GOOGLE_CLIENT_ID: your-google-client-id
      GOOGLE_CLIENT_SECRET: your-google-client-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: server
      - name: Build client
        run: npm run build
        working-directory: client
        env:
          VITE_BACKEND_URL: http://localhost:5000
      - run: npx playwright install chromium --with-deps
      - name: Run smoke E2E tests
        run: npx playwright test tests/auth.spec.ts tests/lobby.spec.ts tests/wallet.spec.ts tests/admin.spec.ts --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

  # ── Job 4b: Full regression E2E (main/staging push) ────────────────────────
  full-e2e:
    name: Full Regression E2E
    runs-on: ubuntu-latest
    needs: [unit-tests, server-tests]
    if: github.event_name == 'push'
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        total: [3]

    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand(\"ping\").ok' --quiet"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      NODE_ENV: test
      CI: true
      MONGODB_URI: mongodb://localhost:27017/7cards_e2e
      MONGODB_URI_TEST: mongodb://localhost:27017/7cards_e2e
      JWT_SECRET: e2e-test-jwt-secret-32-chars!!
      ADMIN_SECRET: admin-test-123
      SESSION_SECRET: e2e-session-secret
      CLIENT_URL: http://localhost:3000
      PORT: '5000'
      GOOGLE_CLIENT_ID: your-google-client-id
      GOOGLE_CLIENT_SECRET: your-google-client-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: server
      - name: Build client
        run: npm run build
        working-directory: client
        env:
          VITE_BACKEND_URL: http://localhost:5000
      - run: npx playwright install chromium --with-deps
      - name: Run full regression (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: >
          npx playwright test --project=chromium
          --shard=${{ matrix.shard }}/${{ matrix.total }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-shard-${{ matrix.shard }}-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # ── Job 5: Merge E2E reports ───────────────────────────────────────────────
  merge-reports:
    name: Merge E2E Reports
    runs-on: ubuntu-latest
    needs: full-e2e
    if: always() && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-shard-*-${{ github.run_number }}
          path: all-reports
      - name: Merge shard reports
        run: npx playwright merge-reports --reporter=html ./all-reports/e2e-results-shard-*/playwright-report
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30

  # ── Job 6: Build check ──────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, server-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Build client
        working-directory: client
        env:
          VITE_BACKEND_URL: ''
        run: |
          npm ci
          npm run build
      - name: Build server
        working-directory: server
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist-${{ github.run_number }}
          path: client/dist/
          retention-days: 3
